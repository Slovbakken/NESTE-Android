plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

// Release signing is supplied by GitHub Actions secrets, never from the public repository.
def nesteSigningPath = System.getenv('NESTE_SIGNING_STORE_FILE')
def nesteSigningPassword = System.getenv('NESTE_SIGNING_PASSWORD')

android {
    signingConfigs {
        nesteRelease {
            if (nesteSigningPath && nesteSigningPassword) {
                storeFile file(nesteSigningPath)
                storePassword nesteSigningPassword
                keyAlias 'neste'
                keyPassword nesteSigningPassword
            }
        }
    }
    namespace 'no.neste.coach'
    compileSdk 35

    defaultConfig {
        applicationId 'no.neste.coach'
        minSdk 26
        targetSdk 35
        versionCode 11
        versionName '1.3.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    buildTypes {
        release {
            if (nesteSigningPath && nesteSigningPassword) signingConfig signingConfigs.nesteRelease
            minifyEnabled false
        }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
